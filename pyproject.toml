[project]
name = "fastCDK"
version = "1.0.0"
description = "DSL for fast generation AWS CDK code of most commonly used AWS services"
authors = [{ name = "Lazar M. Marković", email = "office@lazarmarkovic.net" }]
maintainers = [
  { name = "Lazar M. Marković", email = "office@lazarmarkovic.net" },
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["DSL", "AWS CDK", "code generator"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.9, <=3.14"
dependencies = [
  "textX >= 4.2.3, < 5.0.0",
  "Jinja2 >= 3.1.5, < 4.0.0",
  "importlib-metadata; python_version < '3.10'",
  "typer >= 0.20.0, < 1.0.0",
  "rich >= 14.2.0, < 15.0.0",
  "networkx >= 3.5, < 4.0",
  "pyvis >= 0.3.2, < 0.4.0"
]

[project.entry-points.textx_languages]
fastcdk = "fastcdk.language:fastcdk_language"


[project.scripts]
fastcdk = "fastcdk.cli:app"


[project.optional-dependencies]
dev = ["flit >=3.11.0,<4", "ruff"]


[build-system]
requires = ["flit_core >=3.11.0,<4"]
build-backend = "flit_core.buildapi"


[tool.flit.module]
name = "fastcdk"


[tool.flit.sdist]
include = [
  "fastcdk/dsl/grammar.tx",
  "fastcdk/stack_template/**",
  "fastcdk/dsl_examples/**",
]


[tool.ruff]
line-length = 250
indent-width = 2

[tool.ruff.lint]
# https://docs.astral.sh/ruff/linter/#rule-selection
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
